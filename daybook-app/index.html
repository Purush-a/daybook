<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook: daily expense tracker</title>
<meta name="description" content="Track daily expenses against a monthly budget, with warnings and insights.">
<meta name="theme-color" content="#EFF0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="application-name" content="Daybook">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EFF0EA; --surface:#FFFFFF; --surface-2:#E4E6DE; --line:#D8DBD1;
  --ink:#191B26; --ink-2:#454957; --muted:#6C717F;
  --brand:#FFC233; --brand-ink:#2A1F00;
  --good:#15845A; --warn:#B85C06; --bad:#D0343A;
  --chart:#3A3E52; --scrim:rgba(18,20,28,.42); --toast-act:#FFC233;
  --shadow:0 22px 48px -20px rgba(25,27,38,.38);
  --gx:20px;
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --line:#2E3243;
    --ink:#F2F3F7; --ink-2:#C4C7D2; --muted:#8D92A2;
    --brand:#FFC94D; --brand-ink:#2A1F00;
    --good:#3DCB8D; --warn:#FFA24C; --bad:#FF6B6F;
    --chart:#C9CCDA; --scrim:rgba(0,0,0,.58); --toast-act:#7A4D00;
    --shadow:0 22px 48px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11131B; --surface:#1A1D28; --surface-2:#252937; --line:#2E3243;
  --ink:#F2F3F7; --ink-2:#C4C7D2; --muted:#8D92A2;
  --brand:#FFC94D; --brand-ink:#2A1F00;
  --good:#3DCB8D; --warn:#FFA24C; --bad:#FF6B6F;
  --chart:#C9CCDA; --scrim:rgba(0,0,0,.58); --toast-act:#7A4D00;
  --shadow:0 22px 48px -20px rgba(0,0,0,.75);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:0;top:0}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{max-width:680px;margin:0 auto;padding:10px max(var(--gx),env(safe-area-inset-right,0px)) 128px max(var(--gx),env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--display);letter-spacing:-.015em}
.logo{width:26px;height:26px;border-radius:8px;background:var(--brand);position:relative;flex:none}
.logo::before,.logo::after{content:"";position:absolute;left:6px;height:3px;border-radius:2px;background:var(--brand-ink)}
.logo::before{top:8px;right:6px}
.logo::after{top:15px;right:11px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);background:none;border:0;padding:6px 8px;border-radius:999px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud .dot{background:var(--good)}
.sync.saving .dot{background:var(--brand);animation:pulse 1s infinite}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:66px;padding:0 max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:9px 0 11px;border-radius:12px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke-width:2.4}
.fab{justify-self:center;width:62px;height:62px;border-radius:20px;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 10px 24px -10px rgba(0,0,0,.4),0 0 0 5px var(--bg);box-shadow:0 12px 26px -10px color-mix(in srgb,var(--brand) 80%,#000 20%),0 0 0 5px var(--bg);transition:transform .15s}
.fab:active{transform:translateY(-14px) scale(.96)}
.fab svg{width:28px;height:28px}

/* home */
.greet{margin:12px 0 4px;color:var(--ink-2);font-size:15px}
.hero-num{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 12px;font:800 clamp(40px,12.5vw,76px)/.95 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero-num>span{overflow-wrap:anywhere}
.hero-num.long{font-size:clamp(36px,10.5vw,64px)}
.hero-num small{font:650 clamp(20px,5vw,27px)/1 var(--display);letter-spacing:-.015em;color:var(--ink-2)}
.hero.is-over .hero-num{color:var(--bad)}
.hero-sub{margin:10px 0 0;color:var(--ink-2);max-width:44ch}
.tape{position:relative;margin:28px 0 0;padding-bottom:26px}
.tape-track{position:relative;height:36px;border-radius:11px;background:var(--surface-2);overflow:hidden}
.tape-fill{display:flex;height:100%;transform-origin:left center}
.tape-fill.grow{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.tape-seg{height:100%;flex:none}
.tape-seg+.tape-seg{border-left:2px solid var(--bg)}
.tape-over{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,var(--bad) 0 5px,transparent 5px 10px);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 88%,transparent) 0 5px,transparent 5px 10px)}
.tape-limit{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink)}
.tape-ticks{position:relative;height:9px;margin-top:5px}
.tick{position:absolute;top:0;width:1px;height:4px;background:var(--muted);opacity:.6}
.tick.wk{height:8px;opacity:1}
.tape-today{position:absolute;top:-7px;height:57px;width:0;border-left:2px solid var(--ink);pointer-events:none}
.tape-today span{position:absolute;top:100%;left:0;margin-top:3px;transform:translateX(-50%);font-size:12px;font-weight:650;white-space:nowrap}
.tape-today.start span{transform:translateX(-2px)}
.tape-today.end span{transform:translateX(-100%)}
.status{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0;font-size:15px;color:var(--ink-2)}
.status::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.status.good::before{background:var(--good)}
.status.warn::before{background:var(--warn)}
.status.bad::before{background:var(--bad)}
.mini-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.mini-legend li{display:flex;align-items:center;gap:6px}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:3px;background:var(--c)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin:26px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trio>div{padding:14px 10px 14px 0;min-width:0}
.trio>div+div{padding-left:14px;border-left:1px solid var(--line)}
.trio .k{display:block;font-size:12.5px;line-height:1.25;color:var(--muted)}
.trio b{display:block;margin-top:5px;font:750 clamp(16px,5.2vw,21px)/1.15 var(--display);overflow-wrap:anywhere;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.trio .g{color:var(--good)}
.alerts{display:grid;gap:8px;margin:18px 0 0}
.alert{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;text-align:left;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.alert.over{background:var(--surface);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface));border-color:color-mix(in srgb,var(--bad) 34%,transparent)}
.alert .ico{width:34px;height:34px;font-size:17px;border-radius:10px}

.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec h2,.block h2{margin:0;font:700 19px/1.2 var(--display);letter-spacing:-.015em}
.sec-note{margin:2px 0 10px;font-size:14px;color:var(--muted)}
.link-btn{background:none;border:0;padding:4px 0;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:2px}

.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gx));padding:2px var(--gx) 4px}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.qchip .ico{width:30px;height:30px;border-radius:50%;font-size:15px}
.qchip b{font-weight:650;font-variant-numeric:tabular-nums}

.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;line-height:1;background:var(--surface-2);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;border-radius:0}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:grid}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-amt.fut{color:var(--good)}

.cat-row{display:grid;grid-template-columns:40px 1fr auto;column-gap:12px;row-gap:7px;align-items:center;width:100%;padding:10px 0;background:none;border:0;text-align:left}
.cat-row.r2 .ico{grid-row:1/3;align-self:start}
.cat-row.r3 .ico{grid-row:1/4;align-self:start}
.cat-name{font-weight:600;min-width:0;line-height:1.25}
.cat-amt{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cat-amt b{color:var(--ink);font-weight:650}
.bar{grid-column:2/4;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c)}
.cat-row.warn .bar i{background:var(--warn)}
.cat-row.over .bar i{background:var(--bad)}
.cat-note{grid-column:2/4;margin-top:-2px;font-size:12.5px;color:var(--muted)}
.cat-row.warn .cat-note{color:var(--warn)}
.cat-row.over .cat-note{color:var(--bad);font-weight:600}
.cat-row.goal .bar i{background:var(--good)}

.empty{padding:22px 0 6px;color:var(--ink-2)}
.empty p{margin:0 0 14px;max-width:42ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:15px;color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* history */
.view>.page-title{margin-top:10px}
.page-title{margin:0;font:750 30px/1.1 var(--display);letter-spacing:-.03em}
.search-wrap{position:relative;margin:16px 0 10px}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.search{width:100%;height:48px;padding:0 14px 0 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:16px}
.search:focus{border-color:var(--ink)}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gx));padding:0 var(--gx) 2px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:none;font-size:14px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hist-sum{margin:14px 0 0;font-size:14px;color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 2px;font:700 20px/1.2 var(--display);letter-spacing:-.015em}
.mhead span{font:600 15px var(--text);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dhead{display:flex;justify-content:space-between;gap:12px;padding:14px 0 4px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

/* insights */
.ins-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 20px}
.ins-head .page-title{font-size:26px;text-align:center}
.icon-btn{flex:none;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:20px;height:20px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--bg);padding:14px 12px 14px 0;min-width:0}
.kpi:nth-child(even){padding-left:16px}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi b{display:block;margin:4px 0 2px;font:750 25px/1.1 var(--display);letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.kpi .s.bad{color:var(--bad)}
.kpi .s.good{color:var(--good)}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center}
.donut-box{position:relative;width:100%;max-width:220px}
.donut{display:block;width:100%;height:auto}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-center b{font:750 21px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.donut-center span{font-size:12.5px;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.legend li:last-child{border-bottom:0}
.legend .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .pct{color:var(--muted);text-align:right;min-width:3.4ch;font-variant-numeric:tabular-nums}
.legend .am{font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.dplot{position:relative;height:150px;display:flex;align-items:stretch;gap:2px;margin-top:6px}
.dbar{flex:1;display:flex;align-items:flex-end;min-width:0;padding:0;border:0;background:none;border-radius:3px}
.dbar i{display:block;width:100%;height:var(--h);min-height:2px;border-radius:3px 3px 1px 1px;background:var(--chart);opacity:.78}
.dbar.over i{background:var(--bad);opacity:1}
.dbar.fut i{height:3px;min-height:3px;background:var(--line);opacity:1}
.dbar.today i{background:var(--brand);opacity:1}
.dbar.today.over i{background:var(--bad)}
.dbar.sel i{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.dline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-2);pointer-events:none}
.dline em{position:absolute;right:0;bottom:4px;padding:1px 6px;border-radius:6px;background:var(--bg);font-style:normal;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.dax{display:flex;gap:2px;margin-top:6px;font-size:11px;color:var(--muted)}
.dax span{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:visible}
.chart-cap{margin:10px 0 0;font-size:14px;color:var(--ink-2);min-height:1.45em}
.cplot{position:relative;height:160px;display:flex;align-items:stretch;gap:10px}
.ccol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.ccol i{display:block;width:100%;max-width:46px;height:var(--h);min-height:2px;border-radius:9px 9px 3px 3px;background:var(--chart);opacity:.75}
.ccol.hi i{background:var(--brand);opacity:1}
.ccol.over i{background:var(--bad);opacity:1}
.ccol .v{font-size:11.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cax{display:flex;gap:10px;margin-top:7px}
.cax span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap}
.split{display:flex;height:24px;border-radius:8px;overflow:hidden;background:var(--surface-2);margin:6px 0 12px}
.split span{height:100%;flex:none}
.split span+span{border-left:2px solid var(--bg)}
.split .rest{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 9px)}
.guide{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.guide p{margin:0;display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.guide .ok{color:var(--good);font-weight:650}
.guide .no{color:var(--bad);font-weight:650}

/* plan */
.block{margin-top:30px}
.help{margin:4px 0 12px;font-size:14px;color:var(--muted);max-width:58ch}
.field-label{display:block;margin:16px 0 6px;font-size:14px;font-weight:650;color:var(--ink-2)}
.money-input{display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.money-input:focus-within{border-color:var(--ink)}
.money-input>span{color:var(--muted);font-weight:650}
.money-input input{flex:1;min-width:0;border:0;background:none;outline:none;font:750 25px var(--display);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.money-input input::placeholder{color:var(--muted);opacity:.55}
.money-input.sm{height:42px;width:120px;padding:0 11px;border-radius:11px;gap:5px}
.money-input.sm input{font:650 16px var(--text);letter-spacing:0}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

<script>
(function(){
'use strict';

/* ---------- categories ---------- */
const CATS = [

const CURRENCIES = [['INR','₹  Indian rupee'],['USD','$  US dollar'],['EUR','€  Euro'],['GBP','£  British pound'],['AED','AED  UAE dirham'],['SGD','S$  Singapore dollar'],['AUD','A$  Australian dollar'],['CAD','C$  Canadian dollar'],['JPY','¥  Japanese yen']];
const SAMPLE_LIMITS = {rent:12000, home:2000, groceries:6500, bills:1000, travel:3000, health:1500, food:5000, fun:3000, subs:500, shopping:3500, other:800, card:5000, invest:5000, savings:3000};
const VIEWS = ['home','history','insights','plan'];
const HOSTED = !(window.claude && typeof window.claude.use === 'function');
const DS_RE = /^\d{4}-\d{2}-\d{2}$/;
const LS_KEY = 'daybook.v1';
const PREFS_KEY = 'daybook.prefs';
const ICON = {
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',

};

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const parseDs = ds => { const [y,m,d] = ds.split('-').map(Number); return new Date(y, m-1, d); };
const shiftDay = (ds, n) => { const d = parseDs(ds); d.setDate(d.getDate()+n); return dsOf(d); };
const shiftMonth = (k, n) => { const [y,m] = k.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const daysIn = k => { const [y,m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthName = (k, o) => { const [y,m] = k.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString(undefined, o || {month:'long', year:'numeric'}); };
const grp = n => Number(n).toLocaleString(S.settings.currency === 'INR' ? 'en-IN' : undefined);
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0);
const num = v => { const n = parseFloat(String(v || '').replace(/[^0-9.]/g, '')); return isFinite(n) && n > 0 ? Math.round(n*100)/100 : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
const isSpend = c => (CAT[c] || CAT.other).group !== 'future';
const catOf = id => CAT[id] || CAT.other;

/* ---------- validation ---------- */
function cleanItem(e){
  if (!e || typeof e !== 'object') return null;
  const a = Math.round(Number(e.a) * 100) / 100;
  if (!isFinite(a) || a <= 0 || a > 1e10 || typeof e.d !== 'string' || !DS_RE.test(e.d) || dsOf(parseDs(e.d)) !== e.d) return null;
  const o = {id: typeof e.id === 'string' && e.id ? e.id.slice(0, 48) : uid(), a, c: CAT[e.c] ? e.c : 'other', n: typeof e.n === 'string' ? e.n.slice(0, 80) : '', d: e.d, p: PAY[e.p] ? e.p : 'upi', t: Number(e.t) || 0};
  if (e.s) o.s = 1;
  return o;
}
function cleanMonths(m){
  const out = {}, seen = new Set();
  if (!m || typeof m !== 'object') return out;
  for (const k of Object.keys(m)) {
    if (!Array.isArray(m[k])) continue;
    for (const x of m[k]) { const e = cleanItem(x); if (!e || seen.has(e.id)) continue; seen.add(e.id); const kk = e.d.slice(0, 7); (out[kk] || (out[kk] = [])).push(e); }
  }

function cleanSettings(v){
  const o = Object.assign(defaultSettings(), v && typeof v === 'object' ? v : {});
  o.budget = num(o.budget); o.income = num(o.income);
  o.alertAt = [70, 80, 90].indexOf(+o.alertAt) >= 0 ? +o.alertAt : 80;
  if (['auto', 'light', 'dark'].indexOf(o.theme) < 0) o.theme = 'auto';

/* ---------- state ---------- */
const defaultSettings = () => ({setup:false, currency:'INR', budget:0, income:0, alertAt:80, limits:{}, theme:'auto'});
let S = {settings: defaultSettings(), months: {}};
let view = 'home';
let insMonth = todayStr().slice(0, 7);
let histQuery = '', histCat = 'all', histLimit = 120;
let sh = null, lastFocus = null;
let quickCache = [];
let downloadsNS = null;
let planDirty = false;
let heroAnimated = false;

/* ---------- money formatting ---------- */
let nf0, nf2;
function locale(){ return S.settings.currency === 'INR' ? 'en-IN' : undefined; }
function setupFormat(){
  const cur = S.settings.currency || 'INR';
  try {
    nf0 = new Intl.NumberFormat(locale(), {style:'currency', currency:cur, maximumFractionDigits:0});
    nf2 = new Intl.NumberFormat(locale(), {style:'currency', currency:cur, minimumFractionDigits:2, maximumFractionDigits:2});
      } catch(e) {

  }
}
const money = n => { n = Math.round((n || 0) * 100) / 100; return (n % 1 ? nf2 : nf0).format(n); };
function moneyC(n){
  n = Math.round(n || 0);
  const a = Math.abs(n), inr = S.settings.currency === 'INR';
  let v, u;
  if (inr && a >= 1e7) { v = n / 1e7; u = 'Cr'; }
  else if (inr && a >= 1e5) { v = n / 1e5; u = 'L'; }
  else if (!inr && a >= 1e6) { v = n / 1e6; u = 'M'; }
  else if (a >= 1e4) { v = n / 1e3; u = 'K'; }
  else return nf0.format(n);
  return curSym() + (Math.round(v * 10) / 10).toLocaleString(locale()) + u;
}
function fixedInfo(st){
  let spent = 0, exp = 0;
  for (const c of CATS) if (c.fixed) { const sp = st.byCat[c.id] || 0; spent += sp; exp += Math.max(sp, +S.settings.limits[c.id] || 0); }
  return {spent, exp, varSpent: st.spent - spent};
}
function curSym(){ try { return nf0.formatToParts(0).find(p => p.type === 'currency').value; } catch(e) { return S.settings.currency; } }
function typedDisplay(s){
  if (!s) return '0';
  const [i, d] = s.split('.');
  const ii = Number(i || '0').toLocaleString(locale());
  return d !== undefined ? ii + '.' + d : ii;
}

/* ---------- data access ---------- */
function allItems(){ return Object.values(S.months).flat(); }
function findExp(id){ for (const k in S.months) { const e = S.months[k].find(x => x.id === id); if (e) return e; } return null; }
function stats(k){
  const items = S.months[k] || [];
  const byCat = {}; let spent = 0, saved = 0;
  for (const e of items) { byCat[e.c] = (byCat[e.c] || 0) + e.a; if (isSpend(e.c)) spent += e.a; else saved += e.a; }
  return {items, byCat, spent, saved};
}
function addExpense(e){
  const k = e.d.slice(0, 7);
  (S.months[k] || (S.months[k] = [])).push(e);
  if (!Cloud.ready && Cloud.possible) Cloud.earlyAdds.push(e);
  persistMonth(k);
}
function updateExpense(id, patch){
  const old = findExp(id); if (!old) return;
  const oldK = old.d.slice(0, 7);
  const nu = Object.assign({}, old, patch);
  const newK = nu.d.slice(0, 7);
  S.months[oldK] = S.months[oldK].filter(x => x.id !== id);
  (S.months[newK] || (S.months[newK] = [])).push(nu);
  persistMonth(oldK); if (newK !== oldK) persistMonth(newK);
}
function deleteExpense(id){
  const e = findExp(id); if (!e) return null;
  const k = e.d.slice(0, 7);
  S.months[k] = S.months[k].filter(x => x.id !== id);
  persistMonth(k);
  return e;
}

/* ---------- persistence: account (db) with browser fallback ---------- */
const Cloud = {possible:false, ready:false, db:null, col:null, earlyAdds:[], earlySettings:false, bootLocal:null};
const pending = new Map();
const inflight = new Set();
let settingsTimer = null, settingsDirty = false;

let saveWarnAt = 0;
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({v:1, mode: Cloud.ready || (Cloud.possible && Cloud.bootLocal && Cloud.bootLocal.mode === 'cloud') ? 'cloud' : 'local', settings:S.settings, months:S.months})); }
  catch(e) { if (!Cloud.ready && Date.now() - saveWarnAt > 60000) { saveWarnAt = Date.now(); toast('This device couldn’t save your latest change. Back up your data from Plan.'); } }
}
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
}
function loadPrefs(){ try { return JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; } catch(e) { return {}; } }
function savePrefs(p){ try { localStorage.setItem(PREFS_KEY, JSON.stringify(Object.assign(loadPrefs(), p))); } catch(e) {} }

function persistMonth(k){
  const items = S.months[k] || [];
  if (!items.length) delete S.months[k];
  saveLocal();
  if (Cloud.ready) queueWrite('m-' + k, items.length ? {items} : null);
}
function persistSettings(){
  clearTimeout(settingsTimer); settingsDirty = false;
  saveLocal();
  if (Cloud.ready) queueWrite('settings', S.settings);
  else if (Cloud.possible) Cloud.earlySettings = true;
}
function persistSettingsSoon(){
  settingsDirty = true;
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(persistSettings, 600);
}
function queueWrite(id, data){
  pending.set(id, data === null ? null : clone(data));
  if (!inflight.has(id)) flush(id);
}
async function flush(id){
  inflight.add(id); setSync();
  while (pending.has(id)) {
    const data = pending.get(id); pending.delete(id);
    let tries = 0;
    for (;;) {
      try {
        const ref = Cloud.db.collection(Cloud.col).doc(id);
        if (data === null) await ref.delete(); else await ref.set(data);
        break;
      } catch(e) {
        const code = e && e.code;
        if ((code === 'unavailable' || code === 'resource_exhausted') && tries < 2) { tries++; await sleep(500 + Math.random() * 900 * tries); continue; }
        if (code === 'quota_exceeded') toast('Your storage is full. Export your data, then erase old entries to keep adding.');
        else toast('Couldn’t save to your account. This change is kept in this browser for now.');
        break;
      }
    }
  }
  inflight.delete(id); setSync();
}
function applyDocs(docs){
  const months = {}; let settings = null;
  for (const d of docs) {
    const data = clone(d.data() || {});
    if (d.id === 'settings') settings = data;
    else if (d.id.indexOf('m-') === 0 && Array.isArray(data.items)) months[d.id.slice(2)] = data.items;
  }
  for (const [id, val] of pending) {
    if (id === 'settings') { if (val) settings = clone(val); continue; }
    const k = id.slice(2);
    if (val === null) delete months[k]; else months[k] = clone(val.items);
  }
  S.months = cleanMonths(months);
  if (!settingsDirty) S.settings = cleanSettings(settings);
}
function firstCloud(docs){
  const boot = Cloud.bootLocal;
  const bootHasLocal = boot && boot.mode !== 'cloud' && ((boot.settings && boot.settings.setup) || Object.keys(boot.months || {}).length);
  if (!docs.length) {
    if (!bootHasLocal && boot && boot.mode === 'cloud') {
      // cached copy of an account that has since been erased
      const keep = Cloud.earlySettings ? S.settings : defaultSettings();
      S = {settings: keep, months: {}};
      for (const e of Cloud.earlyAdds) { const k = e.d.slice(0, 7); (S.months[k] || (S.months[k] = [])).push(e); }
    }
    Cloud.ready = true;
    if (S.settings.setup || Object.keys(S.months).length) {
      queueWrite('settings', S.settings);
      for (const k in S.months) if (S.months[k].length) queueWrite('m-' + k, {items: S.months[k]});
    }
  } else {
    const early = Cloud.earlyAdds.slice();
    const earlySettings = Cloud.earlySettings && !docs.some(d => d.id === 'settings') ? clone(S.settings) : null;
    applyDocs(docs);
    Cloud.ready = true;
    const touched = new Set();
    for (const e of early) if (!findExp(e.id)) { const k = e.d.slice(0, 7); (S.months[k] || (S.months[k] = [])).push(e); touched.add(k); }
    touched.forEach(k => queueWrite('m-' + k, {items: S.months[k]}));
    if (earlySettings) { S.settings = earlySettings; queueWrite('settings', S.settings); }
  }
  Cloud.earlyAdds = []; Cloud.earlySettings = false;
}
function initCloud(){
  return new Promise(resolve => {
    const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
    if (!hasClaude) return resolve(false);
    Cloud.possible = true;
    let settled = false;
    const done = ok => { if (!settled) { settled = true; resolve(ok); } };
    setTimeout(() => done(false), 4000);
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(async ([db, user]) => {
      if (!db || !user) { Cloud.possible = false; return done(false); }
      let id = null;
      try { id = await user.id(); } catch(e) {}
      if (!id) { Cloud.possible = false; return done(false); }
      Cloud.db = db; Cloud.col = 'data/users/' + id;
      let first = true;
      let col;
      try { col = db.collection(Cloud.col); } catch(e) { Cloud.possible = false; return done(false); }
      col.onSnapshot(snap => {
        if (first && snap.metadata.fromCache && snap.empty) return;
        const docs = snap.docs.filter(d => d.exists);
        if (first) { first = false; firstCloud(docs); }
        else applyDocs(docs);
        setupFormat(); applyTheme(); saveLocal(); setSync();
        if (!(sh && sh.mode === 'welcome' && !S.settings.setup)) renderCurrent();
        maybeWelcome();
        done(true);
      }, () => {
        Cloud.ready = false; Cloud.possible = false; setSync(); done(false);
      });
    }).catch(() => { Cloud.possible = false; done(false); });
  });
}
function setSync(){
  const b = $('#syncBtn'), t = $('#syncText');
  b.classList.toggle('cloud', Cloud.ready);
  b.classList.toggle('saving', inflight.size > 0);
  t.textContent = inflight.size ? 'Saving…' : Cloud.ready ? 'Synced' : Cloud.possible ? 'Connecting…' : HOSTED ? 'On this device' : 'This browser';
}

/* ---------- shared bits ---------- */
function rowHtml(e, withDate){
  const c = catOf(e.c);
  const subParts = [];
  if (e.n) subParts.push(c.name);
  if (withDate) subParts.push(dayLabel(e.d));
  if (e.p && PAY[e.p]) subParts.push(PAY[e.p]);
  return `<button class="row" data-action="edit" data-id="${esc(e.id)}">
    <span class="ico" style="--c:${c.color}" aria-hidden="true">${c.icon}</span>
    <span class="row-main"><span class="row-title">${esc(e.n || c.name)}</span><span class="row-sub">${esc(subParts.join(', '))}</span></span>
    <span class="row-amt${c.group === 'future' ? ' fut' : ''}">${money(e.a)}</span>
  </button>`;
}
function dayLabel(ds){
  const t = todayStr();
  if (ds === t) return 'Today';
  if (ds === shiftDay(t, -1)) return 'Yesterday';
  const d = parseDs(ds);
  const o = {weekday:'short', day:'numeric', month:'short'};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function level(spent, lim, fixed){
  if (!lim) return '';
  const p = spent / lim * 100;
  // fixed payments (rent, bills, EMIs) are expected to reach their limit, so only overshooting counts
  return p > 100.5 ? 'over' : (!fixed && p >= S.settings.alertAt) ? 'warn' : 'ok';
}
function sortedItems(items){ return items.slice().sort((a, b) => b.d.localeCompare(a.d) || (b.t || 0) - (a.t || 0)); }

/* ---------- home ---------- */
function computeQuick(){
  const since = shiftDay(todayStr(), -60);
  const map = new Map();
  for (const e of allItems()) {
    if (e.d < since || !e.n) continue;
    const key = e.c + '|' + e.n.trim().toLowerCase() + '|' + e.a;
    const m = map.get(key) || {c:e.c, n:e.n.trim(), a:e.a, p:e.p, count:0, last:''};
    m.count++; if (e.d > m.last) m.last = e.d;
    map.set(key, m);
  }
  return [...map.values()].filter(m => m.count >= 2).sort((a, b) => b.count - a.count || b.last.localeCompare(a.last)).slice(0, 8);
}
function renderHome(){
  const el = $('#view-home');
  const t = todayStr(), k = t.slice(0, 7);
  const st = stats(k);
  const B = +S.settings.budget || 0;
  const D = daysIn(k), day = +t.slice(8);
  const daysLeft = D - day + 1;
  const spentToday = sum(st.items.filter(e => e.d === t && isSpend(e.c)), e => e.a);
  const fx = fixedInfo(st);
  const varBudget = Math.max(0, B - fx.exp);
  const varToday = sum(st.items.filter(e => e.d === t && isSpend(e.c) && !catOf(e.c).fixed), e => e.a);
  const paceAmt = Math.min(B, fx.spent + varBudget * day / D);
  const h = new Date().getHours();
  const greet = h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const mName = monthName(k, {month:'long'});

  let numTxt, word, sub, heroCls = '';
  if (!B) { numTxt = money(st.spent); word = 'spent'; sub = `so far in ${mName}.`; }
  else if (st.spent <= B) { numTxt = money(B - st.spent); word = 'left'; sub = `of your ${money(B)} budget for ${mName}, ${daysLeft === 1 ? 'and today is the last day' : `with ${daysLeft} days to go`}.`; }
  else { numTxt = money(st.spent - B); word = 'over budget'; heroCls = 'is-over'; sub = `You’ve spent ${money(st.spent)} against a ${money(B)} budget for ${mName}.`; }

  let status, scls;
  if (!B) { status = 'Set a monthly budget in Plan to see your pace and get warnings.'; scls = ''; }
  else if (st.spent > B) { status = 'Over budget. Hold off on wants until the 1st if you can.'; scls = 'bad'; }
  else if (st.spent - paceAmt > B * 0.01) { status = `${money(Math.round(st.spent - paceAmt))} ahead of the calendar. Slow down a little to finish on budget.`; scls = 'warn'; }
  else { status = `On track, ${money(Math.round(paceAmt - st.spent))} under today’s mark.`; scls = 'good'; }

  // tape
  const scale = Math.max(B, st.spent) || 1;
  const spendCats = CATS.filter(c => c.group !== 'future' && st.byCat[c.id] > 0).sort((a, b) => st.byCat[b.id] - st.byCat[a.id]);
  const segs = spendCats.map(c => `<span class="tape-seg" style="width:${st.byCat[c.id] / st.spent * 100}%;background:${c.color}"></span>`).join('');
  let overlay = '', ticks = '', marker = '';
  if (B && st.spent > B) { const x = B / scale * 100; overlay = `<span class="tape-over" style="left:${x}%"></span><span class="tape-limit" style="left:${x}%"></span>`; }
  if (B) {
    for (let i = 1; i < D; i++) ticks += `<span class="tick${i % 7 === 0 ? ' wk' : ''}" style="left:${Math.min(B, fx.spent + varBudget * i / D) / scale * 100}%"></span>`;
    const mx = paceAmt / scale * 100;
    marker = `<span class="tape-today${mx < 8 ? ' start' : mx > 90 ? ' end' : ''}" style="left:${mx}%"><span>Today</span></span>`;
  }
  const tapeLabel = B ? `${money(st.spent)} spent of ${money(B)}. Today’s mark is ${money(Math.round(paceAmt))}.` : `${money(st.spent)} spent this month.`;
  const tape = `<div class="tape" role="img" aria-label="${esc(tapeLabel)}">
    <div class="tape-track"><div class="tape-fill${heroAnimated ? '' : ' grow'}" style="width:${st.spent / scale * 100}%">${segs}</div>${overlay}</div>
    ${B ? `<div class="tape-ticks" aria-hidden="true">${ticks}</div>` : ''}${marker}
  </div>`;
  heroAnimated = true;
  const legend = spendCats.length ? `<ul class="mini-legend">${spendCats.slice(0, 5).map(c => `<li><span class="dot" style="--c:${c.color}"></span>${esc(c.short)} ${moneyC(st.byCat[c.id])}</li>`).join('')}${spendCats.length > 5 ? `<li>+${spendCats.length - 5} more</li>` : ''}</ul>` : '';

  const safe = B ? Math.max(0, (varBudget - (fx.varSpent - varToday)) / daysLeft - varToday) : null;
  const trio = `<div class="trio">
    <div><span class="k">Safe to spend today</span><b>${B ? money(Math.floor(safe)) : '–'}</b></div>
    <div><span class="k">Spent today</span><b>${money(spentToday)}</b></div>
    <div><span class="k">Saved & invested</span><b class="g">${money(st.saved)}</b></div>
  </div>`;

  // alerts
  const alerts = [];
  for (const c of CATS) {
    if (c.group === 'future') continue;
    const lim = +S.settings.limits[c.id] || 0, sp = st.byCat[c.id] || 0;
    const lv = level(sp, lim, c.fixed);

  }
  alerts.sort((a, b) => b.w - a.w);
  const alertsHtml = alerts.length ? `<div class="alerts">${alerts.slice(0, 3).map(a => `<button class="alert ${a.cls}" data-action="hist-filter" data-cat="${a.c.id}"><span class="ico" style="--c:${a.c.color}" aria-hidden="true">${a.c.icon}</span><span>${esc(a.txt)}</span></button>`).join('')}</div>` : '';

  // quick
  quickCache = computeQuick();

  // categories

  rowCats.sort((a, b) => (a.group === 'future') - (b.group === 'future') || (st.byCat[b.id] || 0) - (st.byCat[a.id] || 0));
  for (const c of rowCats) {

    if (c.group === 'future') {
      const pct = lim ? Math.min(100, sp / lim * 100) : 0;
      rows.push(`<button class="cat-row goal${lim ? ' r3' : ''}" data-action="add-cat" data-cat="${c.id}" style="--c:${c.color}" aria-label="Add to ${esc(c.name)}">
        <span class="ico" aria-hidden="true">${c.icon}</span><span class="cat-name">${esc(c.name)}</span>
        <span class="cat-amt"><b>${money(sp)}</b>${lim ? ` of ${money(lim)}` : ''}</span>
        ${lim ? `<span class="bar"><i style="width:${pct}%"></i></span><span class="cat-note">${sp >= lim ? 'Goal reached for this month' : `${money(lim - sp)} to go for this month’s goal`}</span>` : ''}
      </button>`);
    } else {
      const lv = level(sp, lim, c.fixed);
      const pct = lim ? Math.min(100, sp / lim * 100) : 0;
      const note = !lim ? '' : lv === 'over' ? `${money(sp - lim)} over limit` : `${money(lim - sp)} left`;
      rows.push(`<button class="cat-row ${lv}${lim ? ' r3' : ''}" data-action="add-cat" data-cat="${c.id}" style="--c:${c.color}" aria-label="Add to ${esc(c.name)}">
        <span class="ico" aria-hidden="true">${c.icon}</span><span class="cat-name">${esc(c.name)}</span>
        <span class="cat-amt"><b>${money(sp)}</b>${lim ? ` of ${money(lim)}` : ''}</span>
        ${lim ? `<span class="bar"><i style="width:${pct}%"></i></span><span class="cat-note">${note}</span>` : ''}
      </button>`);
    }
  }
  const catsHtml = `<section class="sec"><div class="sec-head"><h2>This month by category</h2><button class="link-btn" data-action="goto" data-view="plan">Edit limits</button></div>
    ${rows.length ? `<div class="cats">${rows.join('')}</div>` : `<div class="empty"><p>Categories appear here as you spend. Set limits in Plan to get warned before one runs over.</p></div>`}</section>`;

  // recent
  const recent = sortedItems(allItems()).slice(0, 6);
  const recentHtml = `<section class="sec"><div class="sec-head"><h2>Recent</h2>${recent.length ? '<button class="link-btn" data-action="goto" data-view="history">See all</button>' : ''}</div>
    ${recent.length ? `<div class="list">${recent.map(e => rowHtml(e, true)).join('')}</div>` : `<div class="empty"><p>No expenses yet. Tap the yellow + button to log your first one; it takes a few seconds.</p><button class="btn primary" data-action="add">Add an expense</button></div>`}</section>`;

  el.innerHTML = `
    <p class="greet">${greet}</p>
    <section class="hero ${heroCls}">
      <h1 class="hero-num${numTxt.length > 9 ? ' long' : ''}"><span>${numTxt}</span><small>${word}</small></h1>

    ${trio}
    ${alertsHtml}
    ${quickHtml}
    ${catsHtml}
    ${recentHtml}`;
}

  const filtered = histCat !== 'all' || q;
  $('#histSum').textContent = filtered && items.length ? `${plural(items.length, 'expense')}, ${money(sum(items, e => e.a))} in total` : '';
  if (!total) { list.innerHTML = `<div class="empty"><p>Nothing here yet. Every expense you log shows up here, newest first.</p><button class="btn primary" data-action="add">Add an expense</button></div>`; return; }
  if (!items.length) { list.innerHTML = `<div class="empty"><p>No expenses match ${q ? `“${esc(histQuery.trim())}”` : 'this filter'}.</p></div>`; return; }
  const mTot = {}, dTot = {};
  const counts = e => isSpend(e.c) || histCat === e.c;
  for (const e of items) { if (!counts(e)) continue; const k = e.d.slice(0, 7); mTot[k] = (mTot[k] || 0) + e.a; dTot[e.d] = (dTot[e.d] || 0) + e.a; }
  let html = '', curM = '', curD = '';
  const shown = items.slice(0, histLimit);
  for (const e of shown) {
    const k = e.d.slice(0, 7);
    if (k !== curM) { if (curM) html += '</div>'; curM = k; curD = ''; html += `<h2 class="mhead">${esc(monthName(k))}<span>${money(mTot[k] || 0)} ${histCat !== 'all' && !isSpend(histCat) ? 'set aside' : 'spent'}</span></h2><div class="list">`; }
    if (e.d !== curD) { curD = e.d; html += `<div class="dhead"><span>${esc(dayLabel(e.d))}</span><span>${money(dTot[e.d] || 0)}</span></div>`; }
    html += rowHtml(e, false);
  }
  html += '</div>';
  if (items.length > histLimit) html += `<div class="empty"><button class="btn wide" data-action="hist-more">Show older expenses</button></div>`;
  list.innerHTML = html;
}

/* ---------- insights ---------- */
function colChart(cols, opts){
  const max = Math.max(1, ...cols.map(c => c.v), opts.line || 0) / 0.82;
  const line = opts.line ? `<span class="dline" style="bottom:${opts.line / max * 100}%"></span>` : '';
  return `<div class="cplot">${cols.map(c => `<div class="ccol ${c.cls || ''}"><span class="v">${c.v ? moneyC(c.v) : ''}</span><i style="--h:${c.v / max * 100}%"></i></div>`).join('')}${line}</div>
    <div class="cax">${cols.map(c => `<span>${esc(c.label)}</span>`).join('')}</div>`;
}
function renderInsights(){
  const el = $('#view-insights');
  const t = todayStr(), curK = t.slice(0, 7), k = insMonth;
  const st = stats(k), B = +S.settings.budget || 0, D = daysIn(k);
  const isCur = k === curK;
  const elapsed = isCur ? +t.slice(8) : D;
  const prevK = shiftMonth(k, -1), prev = stats(prevK);
  const head = `<div class="ins-head"><button class="icon-btn" data-action="ins-prev" aria-label="Previous month">${ICON.left}</button><h1 class="page-title">${esc(monthName(k))}</h1><button class="icon-btn" data-action="ins-next" aria-label="Next month"${k >= curK ? ' disabled' : ''}>${ICON.right}</button></div>`;
  if (!st.items.length) {
    el.innerHTML = head + `<div class="empty"><p>Nothing logged in ${esc(monthName(k, {month:'long'}))}${isCur ? ' yet. Charts fill in as you add expenses.' : '.'}</p>${isCur ? '<button class="btn primary" data-action="add">Add an expense</button>' : ''}</div>`;
    return;
  }
  const avg = st.spent / elapsed;
  const fx = fixedInfo(st);
  const varBudget = Math.max(0, B - fx.exp);
  const proj = isCur ? fx.exp + fx.varSpent / elapsed * D : st.spent;
  const vsPrev = prev.spent ? (st.spent - prev.spent) / prev.spent * 100 : null;

  const kpi3 = isCur
    ? `<div class="kpi"><span class="k">Projected for the month</span><b>${money(Math.round(proj))}</b><span class="s ${B ? (proj > B ? 'bad' : 'good') : ''}">${B ? (proj > B ? `${money(Math.round(proj - B))} over budget at this pace` : `${money(Math.round(B - proj))} under budget at this pace`) : 'at your current pace'}</span></div>`
    : `<div class="kpi"><span class="k">Against budget</span><b>${B ? money(Math.abs(B - st.spent)) : '–'}</b><span class="s ${B ? (st.spent > B ? 'bad' : 'good') : ''}">${B ? (st.spent > B ? 'over budget' : 'under budget') : 'no budget set'}</span></div>`;
  const kpis = `<div class="kpis">
    <div class="kpi"><span class="k">Spent</span><b>${money(st.spent)}</b><span class="s">${B ? `${Math.round(st.spent / B * 100)}% of ${money(B)}` : `plus ${money(st.saved)} set aside`}</span></div>
    <div class="kpi"><span class="k">Everyday spend a day</span><b>${money(Math.round(fx.varSpent / elapsed))}</b><span class="s">${B ? `budget allows ${money(Math.round(varBudget / D))}` : `over ${plural(elapsed, 'day')}`}</span></div>
    ${kpi3}
    <div class="kpi"><span class="k">Versus ${esc(monthName(prevK, {month:'long'}))}</span><b>${vsPrev === null ? '–' : `${vsPrev > 0 ? '+' : ''}${Math.round(vsPrev)}%`}</b><span class="s ${vsPrev === null ? '' : vsPrev > 0 ? 'bad' : 'good'}">${vsPrev === null ? 'no data for that month' : `${money(prev.spent)} spent then`}</span></div>
  </div>`;

  // donut
  const parts = CATS.filter(c => isSpend(c.id) && st.byCat[c.id] > 0).map(c => ({c, v: st.byCat[c.id]})).sort((a, b) => b.v - a.v);
  let donutHtml = '';
  if (st.spent > 0) {
    const R = 78, C = 2 * Math.PI * R, gap = parts.length > 1 ? 2.2 : 0;
    let acc = 0;
    const segs = parts.map(p => { const len = p.v / st.spent * C; const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${p.c.color}" stroke-width="30" stroke-dasharray="${Math.max(0.01, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"><title>${esc(p.c.name)}: ${money(p.v)}</title></circle>`; acc += len; return s; }).join('');
    donutHtml = `<section class="sec"><div class="sec-head"><h2>Where it went</h2></div>
      <div class="donut-wrap">
        <div class="donut-box"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Spending by category"><circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--surface-2)" stroke-width="30"/>${segs}</svg><div class="donut-center"><b>${moneyC(st.spent)}</b><span>spent</span></div></div>
        <ul class="legend">${parts.map(p => `<li><span class="dot" style="--c:${p.c.color}"></span><span class="nm">${p.c.icon} ${esc(p.c.name)}</span><span class="pct">${Math.round(p.v / st.spent * 100)}%</span><span class="am">${money(p.v)}</span></li>`).join('')}</ul>
      </div></section>`;
  }

  // daily
  const daily = Array(D).fill(0), dailyCount = Array(D).fill(0);
  for (const e of st.items) if (isSpend(e.c) && !catOf(e.c).fixed) { const i = +e.d.slice(8) - 1; daily[i] += e.a; dailyCount[i]++; }
  const dl = B ? varBudget / D : 0;
  const maxV = Math.max(...daily, dl * 1.3, 1);
  const overDays = daily.slice(0, elapsed).filter(v => dl && v > dl).length;
  const bars = daily.map((v, i) => {
    const dN = i + 1, fut = isCur && dN > elapsed;
    const cls = [fut ? 'fut' : '', !fut && dl && v > dl ? 'over' : '', isCur && dN === elapsed ? 'today' : ''].join(' ');
    return `<button class="dbar ${cls}" data-action="day-bar" data-d="${dN}" data-v="${v}" data-n="${dailyCount[i]}" style="--h:${v / maxV * 100}%" aria-label="${esc(monthName(k, {month:'short'}))} ${dN}: ${money(v)}"${fut ? ' tabindex="-1"' : ''}><i></i></button>`;
  }).join('');
  const axis = daily.map((_, i) => { const d = i + 1; return `<span>${d === 1 || d % 5 === 0 ? d : ''}</span>`; }).join('');
  const dayCapDefault = dl ? `Above the daily budget on ${overDays} of ${plural(elapsed, 'day')}. Tap a bar for details.` : 'Tap a bar to see that day.';
  const dayHtml = `<section class="sec"><div class="sec-head"><h2>Everyday spending, day by day</h2></div>
    <p class="sec-note">Rent, utilities, recharges, subscriptions and card payments are left out so one big payment doesn’t hide the pattern.</p>
    <div class="dplot">${bars}${dl ? `<span class="dline" style="bottom:${dl / maxV * 100}%"><em>Daily budget ${money(Math.round(dl))}</em></span>` : ''}</div>
    <div class="dax" aria-hidden="true">${axis}</div>
    <p class="chart-cap" id="dayCap" data-default="${esc(dayCapDefault)}">${esc(dayCapDefault)}</p></section>`;

  // split
  const g = {needs:0, wants:0, debt:0, future:0};
  for (const e of st.items) g[catOf(e.c).group] += e.a;
  const out = g.needs + g.wants + g.debt + g.future;
  const inc = +S.settings.income || 0;
  const sc = Math.max(inc, out) || 1;
  const gkeys = ['needs', 'wants', 'debt', 'future'].filter(x => g[x] > 0);
  const splitBar = `<div class="split" role="img" aria-label="Needs, wants, card and EMI, and savings">${gkeys.map(x => `<span style="width:${g[x] / sc * 100}%;background:${GROUPS[x].color}"></span>`).join('')}${inc > out ? `<span class="rest" style="width:${(inc - out) / sc * 100}%"></span>` : ''}</div>`;
  const base = inc || out;
  const splitRows = `<ul class="legend">${gkeys.map(x => `<li><span class="dot" style="--c:${GROUPS[x].color}"></span><span class="nm">${GROUPS[x].name}</span><span class="pct">${Math.round(g[x] / base * 100)}%</span><span class="am">${money(g[x])}</span></li>`).join('')}${inc > out ? `<li><span class="dot" style="--c:var(--line)"></span><span class="nm">Not yet spent or saved</span><span class="pct">${Math.round((inc - out) / inc * 100)}%</span><span class="am">${money(inc - out)}</span></li>` : ''}</ul>`;
  let guide = '';
  if (inc) {
    const pN = (g.needs + g.debt) / inc * 100, pW = g.wants / inc * 100, pF = g.future / inc * 100;
    const line = (label, p, ok, target) => `<p><span>${label}: ${Math.round(p)}% of income</span><span class="${ok ? 'ok' : 'no'}">${target}</span></p>`;
    guide = `<div class="guide">${line('Needs and EMIs', pN, pN <= 50, 'guide: up to 50%')}${line('Wants', pW, pW <= 30, 'guide: up to 30%')}${line('Saved and invested', pF, isCur ? true : pF >= 20, 'guide: at least 20%')}</div>`;
  }
  const splitHtml = `<section class="sec"><div class="sec-head"><h2>Needs, wants and the future</h2></div>
    <p class="sec-note">${inc ? `Shares of your ${money(inc)} monthly income, checked against the 50/30/20 guide.` : 'Add your monthly income in Plan to check this against the 50/30/20 guide.'}</p>
    ${splitBar}${splitRows}${guide}</section>`;

  // trend
  let months6 = [...Array(6)].map((_, i) => shiftMonth(k, i - 5));
  const firstIdx = months6.findIndex(m => (S.months[m] || []).length);
  months6 = months6.slice(Math.min(firstIdx < 0 ? 3 : firstIdx, 3));
  const trendCols = months6.map(m => { const v = stats(m).spent; return {v, label: monthName(m, {month:'short'}), cls: m === k ? 'hi' : (B && v > B ? 'over' : '')}; });
  const trendHtml = `<section class="sec"><div class="sec-head"><h2>Month by month</h2></div>${B ? `<p class="sec-note">The dashed line is your ${money(B)} budget.</p>` : ''}${colChart(trendCols, {line: B})}</section>`;

  // weekday
  const wsum = Array(7).fill(0), wcnt = Array(7).fill(0);
  for (let d = 1; d <= elapsed; d++) wcnt[parseDs(`${k}-${pad(d)}`).getDay()]++;
  for (const e of st.items) if (isSpend(e.c) && !catOf(e.c).fixed) wsum[parseDs(e.d).getDay()] += e.a;
  const order = [1, 2, 3, 4, 5, 6, 0];
  const wavg = order.map(w => wcnt[w] ? wsum[w] / wcnt[w] : 0);
  const wmaxI = wavg.indexOf(Math.max(...wavg));
  const wname = (w, f) => new Date(2026, 0, 4 + w).toLocaleDateString(undefined, {weekday: f});
  const weekCols = order.map((w, i) => ({v: Math.round(wavg[i]), label: wname(w, 'short'), cls: i === wmaxI ? 'hi' : ''}));
  const weekHtml = `<section class="sec"><div class="sec-head"><h2>Costliest days of the week</h2></div>
    <p class="sec-note">${wavg[wmaxI] ? `Everyday spending is highest on ${esc(wname(order[wmaxI], 'long'))}s, ${money(Math.round(wavg[wmaxI]))} on average.` : 'No everyday spending yet this month.'}</p>${colChart(weekCols, {})}</section>`;

  // pay
  const pays = {};
  for (const e of st.items) if (isSpend(e.c)) pays[e.p || 'upi'] = (pays[e.p || 'upi'] || 0) + e.a;
  const payHtml = st.spent ? `<section class="sec"><div class="sec-head"><h2>How you paid</h2></div><div class="cats">${PAYS.filter(p => pays[p.id]).map(p => `<div class="cat-row r2" style="--c:var(--chart)"><span class="ico" style="--c:var(--chart)" aria-hidden="true">${p.id === 'upi' ? '⚡' : p.id === 'cash' ? '💵' : '💳'}</span><span class="cat-name">${p.name}</span><span class="cat-amt"><b>${money(pays[p.id])}</b> ${Math.round(pays[p.id] / st.spent * 100)}%</span><span class="bar"><i style="width:${pays[p.id] / st.spent * 100}%"></i></span></div>`).join('')}</div></section>` : '';

  // biggest
  const top = st.items.filter(e => isSpend(e.c)).sort((a, b) => b.a - a.a).slice(0, 5);
  const topHtml = top.length ? `<section class="sec"><div class="sec-head"><h2>Biggest expenses</h2></div><div class="list">${top.map(e => rowHtml(e, true)).join('')}</div></section>` : '';

  el.innerHTML = head + kpis + donutHtml + dayHtml + splitHtml + trendHtml + weekHtml + payHtml + topHtml;
}

function updateLimSum(){
  const p = $('#limSum'); if (!p) return;
  const B = +S.settings.budget || 0;
  const total = sum(CATS.filter(c => c.group !== 'future'), c => +S.settings.limits[c.id] || 0);
  p.classList.remove('warn');
  if (!total) { p.textContent = ''; return; }
  if (!B) { p.textContent = `Your limits add up to ${money(total)}.`; return; }
  if (total > B) { p.classList.add('warn'); p.textContent = `Your limits add up to ${money(total)}, which is ${money(total - B)} more than your budget.`; }
  else p.textContent = `Your limits add up to ${money(total)} of your ${money(B)} budget, leaving ${money(B - total)} unassigned.`;
}

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeSample(){
  const rnd = mulberry32(20261027);
  const r = (a, b) => Math.round((a + rnd() * (b - a)) / 10) * 10;
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const t = todayStr(), cur = t.slice(0, 7);
  const out = []; let seq = 0;
  for (const k of [shiftMonth(cur, -2), shiftMonth(cur, -1), cur]) {
    const last = k === cur ? +t.slice(8) : daysIn(k);
    for (let d = 1; d <= last; d++) {
      const ds = `${k}-${pad(d)}`, wd = parseDs(ds).getDay();
      const add = (c, a, n, p) => out.push({id: uid() + (seq++), a, c, n, d: ds, p: p || pick(['upi','upi','upi','cash','card']), t: parseDs(ds).getTime() + seq, s: 1});
      if (d === 1) add('rent', 12000, 'Monthly rent', 'upi');
      if (d === 2) add('savings', 3000, 'Emergency fund', 'upi');
      if (d === 3) add('subs', 149, 'Music app', 'card');
      if (d === 5) add('home', r(1400, 2100), 'Electricity bill', 'upi');
      if (d === 7) add('invest', 5000, 'Index fund SIP', 'upi');
      if (d === 9) add('bills', 299, 'Mobile recharge', 'upi');
      if (d === 12) add('bills', 589, 'Broadband', 'upi');
      if (d === 15) add('card', r(3600, 5200), 'Credit card bill', 'upi');
      if (d === 18) add('subs', 199, 'Streaming plan', 'card');
      if (d % 3 === 1) add('groceries', r(250, 1000), pick(['Vegetables & fruits', 'Provisions', 'Milk & bread', 'Supermarket run']));
      if (rnd() < .8) add('food', 30, 'Tea & snacks', 'cash');
      if (rnd() < .3) add('food', r(220, 620), pick(['Dinner out', 'Food delivery', 'Lunch with team', 'Biryani night']));
      if (wd >= 1 && wd <= 5 && rnd() < .8) add('travel', pick([40, 40, 60, 120]), pick(['Metro', 'Metro', 'Bus', 'Auto ride']));
      if (rnd() < .07) add('travel', r(400, 900), 'Petrol');
      if ((wd === 0 || wd === 6) && rnd() < .55) add('fun', r(250, 850), pick(['Movie tickets', 'Weekend outing', 'Gaming', 'Bowling']));
      if (rnd() < .06) add('shopping', r(400, 2200), pick(['T-shirts', 'Earphones', 'Shoes', 'Home decor', 'Books']));
      if (rnd() < .06) add('health', r(150, 800), pick(['Pharmacy', 'Doctor visit', 'Gym day pass']));
      if (rnd() < .025) add('other', r(300, 1000), pick(['Birthday gift', 'Donation']));
    }
  }
  return out;
}

/* ---------- files: export, backup, restore ---------- */
function canSaveFiles(){ return !!downloadsNS || HOSTED; }
async function saveFile(filename, text, mime){
  if (downloadsNS) { await downloadsNS.save({filename, data: text}); return; }
  if (!HOSTED) throw {code: 'unavailable'};
  const blob = new Blob([text], {type: mime});
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (coarse && typeof File === 'function' && navigator.canShare && navigator.share) {
    const file = new File([blob], filename, {type: mime});
    if (navigator.canShare({files: [file]})) {
      try { await navigator.share({files: [file]}); return; }
      catch(e) { if (e && e.name === 'AbortError') throw {code: 'declined'}; }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function fileError(e){
  if (e && e.code === 'declined') return;
  if (e && e.code === 'rate_limited') toast('A save prompt is already open.');
  else toast('Saving files isn’t available here.');
}
async function exportBackup(){
  const text = JSON.stringify({app: 'daybook', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, months: S.months});
  try { await saveFile(`daybook-backup-${todayStr()}.json`, text, 'application/json'); savePrefs({lastBackup: todayStr()}); renderPlan(); toast('Backup saved. Keep the file somewhere safe, like iCloud Drive.'); }
  catch(e) { fileError(e); }
}
function restoreFrom(text){
  let data = null;
  try { data = JSON.parse(text); } catch(e) {}
  if (!data || data.app !== 'daybook' || !data.months || typeof data.months !== 'object') { toast('That file isn’t a Daybook backup.'); return; }
  const incoming = cleanMonths(data.months);
  const have = new Set(allItems().map(e => e.id));
  const touched = new Set(); let added = 0;
  for (const k of Object.keys(incoming)) for (const e of incoming[k]) {
    if (have.has(e.id)) continue;
    (S.months[k] || (S.months[k] = [])).push(e); have.add(e.id); touched.add(k); added++;
    if (!Cloud.ready && Cloud.possible) Cloud.earlyAdds.push(e);
  }
  if (data.settings) {
    const inc = cleanSettings(data.settings);
    S.settings.budget = inc.budget || S.settings.budget;
    S.settings.income = inc.income || S.settings.income;
    if (Object.keys(inc.limits).length) S.settings.limits = inc.limits;
    S.settings.alertAt = inc.alertAt; S.settings.currency = inc.currency;
    setupFormat();
  }
  S.settings.setup = true;
  persistSettings(); touched.forEach(persistMonth);
  if (sh && sh.mode === 'welcome') { sh = {mode: 'welcome-done'}; closeSheet(); }
  heroAnimated = false; renderCurrent();
  toast(added ? `Restored ${plural(added, 'expense')} from the backup.` : 'Everything in that backup is already here.');
}
async function exportCsv(){
  if (!canSaveFiles()) return;
  const rows = [['Date', 'Category', 'Group', 'Note', 'Amount', 'Currency', 'Paid with']];
  for (const e of sortedItems(allItems()).reverse()) { const c = catOf(e.c); rows.push([e.d, c.name, GROUPS[c.group].name, e.n || '', e.a, S.settings.currency, PAY[e.p] || '']); }
  const csv = rows.map(r => r.map(v => { const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  try { await saveFile(`daybook-expenses-${todayStr()}.csv`, '\ufeff' + csv, 'text/csv'); toast('CSV export saved'); }
  catch(e) { fileError(e); }
}

  if (ev.key === 'Escape' && sh) { closeSheet(); return; }
  if (sh && sh.mode === 'welcome') { if (ev.key === 'Enter' && ev.target.id === 'wBudget') { ev.preventDefault(); const b = $('[data-action="welcome-start"]'); if (b) b.click(); } return; }
  if (sh && (sh.mode === 'add' || sh.mode === 'edit')) {
    if (ev.key === 'Enter' && (!typing || ev.target.id === 'noteIn')) { ev.preventDefault(); if (ev.target.id === 'noteIn' && !num(sh.amount)) { ev.target.blur(); return; } saveSheet(); return; }
    if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); keyPress(ev.key); }
    else if (ev.key === '.' || ev.key === ',') { ev.preventDefault(); keyPress('.'); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); keyPress('del'); }
    return;
  }
  if (!sh && !typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey && (ev.key === 'n' || ev.key === 'N' || ev.key === '+')) { ev.preventDefault(); openSheet({mode:'add'}); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (settingsDirty) persistSettings(); }
  else if (!sh) renderCurrent();
});
window.addEventListener('pagehide', () => { if (settingsDirty) persistSettings(); });
document.addEventListener('touchstart', () => {}, {passive: true});
(function(){
  const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', syncThemeColor); else if (mq.addListener) mq.addListener(syncThemeColor); }
})();
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.indexOf(h) >= 0) go(h); });

/* ---------- boot ---------- */
(function boot(){
  const local = loadLocal();
  Cloud.bootLocal = local;
  if (local && typeof local === 'object') {
    S.settings = cleanSettings(local.settings);
    S.months = cleanMonths(local.months);
  }
  setupFormat(); applyTheme();
  const h = location.hash.slice(1);
  go(VIEWS.indexOf(h) >= 0 ? h : 'home');
  Cloud.possible = !HOSTED;
  setSync();
  if (HOSTED) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e) {}
    const local0 = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || local0) && window.top === window.self) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  }
  if (!HOSTED) {
    initCloud().then(() => { setSync(); maybeWelcome(); if (view === 'plan') renderPlan(); });
    window.claude.use('downloads').then(ns => { downloadsNS = ns; if (view === 'plan') renderPlan(); }).catch(() => {});
  } else {
    maybeWelcome();
  }
})();
})();
</script>
